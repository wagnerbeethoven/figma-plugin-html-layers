  <text x="556" y="675" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" fill="#c4b0ff" text-anchor="middle">🌙 Dark Mode</text>

  <rect x="656" y="644" width="140" height="50" rx="10" fill="#7b61ff" fill-opacity="0.12"/>
