  <!-- Code path -->
  <rect x="80" y="528" width="770" height="80" rx="14" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="80" y="528" width="770" height="80" rx="14" stroke="#7b61ff" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="118" cy="568" r="6" fill="#7b61ff" fill-opacity="0.8"/>
  <text x="142" y="577" font-family="'Courier New',Consolas,monospace"
