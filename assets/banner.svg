  <!-- Card 2: nav -->
  <rect x="1118" y="376" width="256" height="78" rx="14" fill="#18152a" stroke="#2a2545" stroke-width="1.5"/>
  <text x="1156" y="423" font-family="'Courier New',monospace" font-size="26" fill="#5a4faa">&lt;</text>
  <text x="1180" y="423" font-family="'Courier New',monospace" font-size="26" fill="#a891ff">nav</text>
  <text x="1233" y="423" font-family="'Courier New',monospace" font-size="26" fill="#5a4faa">&gt;</text>

  <!-- Card 3: ul -->
  <rect x="1216" y="516" width="236" height="78" rx="14" fill="#18152a" stroke="#2a2545" stroke-width="1.5"/>
  <text x="1254" y="563" font-family="'Courier New',monospace" font-size="26" fill="#5a4faa">&lt;</text>
  <text x="1278" y="563" font-family="'Courier New',monospace" font-size="26" fill="#a891ff">ul</text>
  <text x="1315" y="563" font-family="'Courier New',monospace" font-size="26" fill="#5a4faa">&gt;</text>

  <!-- Card 4: li ACTIVE -->
  <rect x="1306" y="656" width="266" height="88" rx="14" fill="#241a5e" stroke="#7b61ff" stroke-width="2"/>
  <rect x="1306" y="656" width="266" height="88" rx="14" fill="#7b61ff" fill-opacity="0.07"/>
  <text x="1348" y="708" font-family="'Courier New',monospace" font-size="32" font-weight="700" fill="#9b87ff">&lt;</text>
  <text x="1378" y="708" font-family="'Courier New',monospace" font-size="32" font-weight="700" fill="#e0d4ff">li</text>
  <text x="1414" y="708" font-family="'Courier New',monospace" font-size="32" font-weight="700" fill="#9b87ff">&gt;</text>
  <circle cx="1545" cy="700" r="8" fill="#7b61ff"/>

  <!-- Card 5: a -->
  <rect x="1396" y="786" width="220" height="78" rx="14" fill="#18152a" stroke="#2a2545" stroke-width="1.5"/>
  <text x="1434" y="833" font-family="'Courier New',monospace" font-size="26" fill="#5a4faa">&lt;</text>
  <text x="1458" y="833" font-family="'Courier New',monospace" font-size="26" fill="#a891ff">a</text>
  <text x="1484" y="833" font-family="'Courier New',monospace" font-size="26" fill="#5a4faa">&gt;</text>

  <!-- Path label -->
  <text x="1020" y="910" font-family="'Courier New',Consolas,monospace"
        font-size="20" fill="#7b61ff" fill-opacity="0.38" letter-spacing="1">
    header &gt; nav &gt; ul &gt; li &gt; a
