  <!-- Pills -->
  <rect x="80"  y="644" width="196" height="50" rx="10" fill="#7b61ff" fill-opacity="0.12"/>
  <rect x="80"  y="644" width="196" height="50" rx="10" stroke="#7b61ff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="178" y="675" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" fill="#c4b0ff" text-anchor="middle">⚡ Batch Rename</text>

  <rect x="288" y="644" width="168" height="50" rx="10" fill="#7b61ff" fill-opacity="0.12"/>
  <rect x="288" y="644" width="168" height="50" rx="10" stroke="#7b61ff" stroke-opacity="0.35" stroke-width="1"/>
  <text x="372" y="675" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" fill="#c4b0ff" text-anchor="middle">🏷 50+ Tags</text>

  <rect x="468" y="644" width="176" height="50" rx="10" fill="#7b61ff" fill-opacity="0.12"/>
