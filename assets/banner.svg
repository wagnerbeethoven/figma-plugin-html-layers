  <line x1="1120" y1="316" x2="1150" y2="376" stroke="#7b61ff" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="1218" y1="456" x2="1248" y2="516" stroke="#7b61ff" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="1308" y1="596" x2="1338" y2="656" stroke="#7b61ff" stroke-opacity="0.48" stroke-width="2" stroke-dasharray="6 5"/>
