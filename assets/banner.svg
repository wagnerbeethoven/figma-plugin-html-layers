<svg width="1920" height="960" viewBox="0 0 1920 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e0c18"/>
      <stop offset="1" stop-color="#1a1035"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#7b61ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#7b61ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a991ff"/>
      <stop offset="1" stop-color="#5c3ee8"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="960" fill="url(#bg)"/>
  <ellipse cx="520"  cy="400" rx="600" ry="480" fill="url(#glowL)"/>
  <ellipse cx="1580" cy="460" rx="520" ry="420" fill="url(#glowR)"/>
  <line x1="960" y1="80" x2="960" y2="880" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- ── LEFT ── -->

  <!-- Logo -->
  <rect x="80" y="200" width="100" height="100" rx="24" fill="url(#logoGrad)"/>
  <rect x="80" y="200" width="100" height="100" rx="24" fill="white" fill-opacity="0.07"/>
  <text x="130" y="267" font-family="'Courier New',Consolas,monospace"
