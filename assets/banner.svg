<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d0d14"/>
      <stop offset="1" stop-color="#160f30"/>
    </linearGradient>
    <!-- Purple glow right -->
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#7b61ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Purple glow left -->
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#7b61ff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <!-- Logo gradient -->
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9b85ff"/>
      <stop offset="1" stop-color="#6040ee"/>
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1e1b2e"/>
      <stop offset="1" stop-color="#16142a"/>
    </linearGradient>
    <!-- Active card gradient -->
    <linearGradient id="activeCard" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2e1f6e"/>
      <stop offset="1" stop-color="#1e1050"/>
    </linearGradient>
  </defs>

  <!-- ─── Background ─── -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>

  <!-- Ambient glows -->
  <ellipse cx="1100" cy="260" rx="420" ry="340" fill="url(#glowR)"/>
  <ellipse cx="160"  cy="180" rx="320" ry="260" fill="url(#glowL)"/>

  <!-- Subtle horizontal rule -->
  <line x1="0" y1="600" x2="1280" y2="600" stroke="#7b61ff" stroke-opacity="0.12" stroke-width="1"/>

  <!-- ─── Divider ─── -->
  <line x1="700" y1="60" x2="700" y2="580" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>


  <!-- ════════════════════════════════════════ -->
  <!-- LEFT COLUMN                             -->
  <!-- ════════════════════════════════════════ -->

  <!-- Logo badge -->
  <rect x="80" y="180" width="76" height="76" rx="18" fill="url(#logoGrad)"/>
  <!-- subtle inner shadow overlay -->
  <rect x="80" y="180" width="76" height="76" rx="18" fill="white" fill-opacity="0.08"/>
  <!-- </> text -->
  <text x="118" y="229"
        font-family="'Courier New', Consolas, monospace"
        font-size="24" font-weight="700"
        fill="white" text-anchor="middle">&lt;/&gt;</text>

  <!-- Plugin name -->
  <text x="80" y="326"
        font-family="'Segoe UI', -apple-system, system-ui, sans-serif"
        font-size="68" font-weight="700" letter-spacing="-2"
        fill="white">HTMLayers</text>

  <!-- Subtitle -->
  <text x="80" y="372"
        font-family="'Segoe UI', -apple-system, system-ui, sans-serif"
        font-size="21" fill="#9b93c4" letter-spacing="0.2">
    Semantic HTML names for Figma layers
  </text>

  <!-- Code path example box -->
  <rect x="80" y="402" width="530" height="50" rx="10"
        fill="#ffffff" fill-opacity="0.04"/>
  <rect x="80" y="402" width="530" height="50" rx="10"
        stroke="#7b61ff" stroke-opacity="0.35" stroke-width="1"/>
  <!-- dot on left -->
  <circle cx="106" cy="427" r="4" fill="#7b61ff" fill-opacity="0.7"/>
  <text x="126" y="433"
        font-family="'Courier New', Consolas, monospace"
        font-size="15" letter-spacing="0.3"
        fill="#a891ff">
    header &gt; nav &gt; ul &gt; li &gt; a
  </text>

  <!-- Feature pills -->
  <!-- Pill: Batch rename -->
  <rect x="80" y="474" width="138" height="30" rx="7"
        fill="#7b61ff" fill-opacity="0.12"/>
  <rect x="80" y="474" width="138" height="30" rx="7"
        stroke="#7b61ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="149" y="494"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#c4b8ff" text-anchor="middle">⚡ Batch Rename</text>

  <!-- Pill: 50+ tags -->
  <rect x="228" y="474" width="108" height="30" rx="7"
        fill="#7b61ff" fill-opacity="0.12"/>
  <rect x="228" y="474" width="108" height="30" rx="7"
        stroke="#7b61ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="282" y="494"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#c4b8ff" text-anchor="middle">🏷 50+ Tags</text>

  <!-- Pill: Dark mode -->
  <rect x="346" y="474" width="116" height="30" rx="7"
        fill="#7b61ff" fill-opacity="0.12"/>
  <rect x="346" y="474" width="116" height="30" rx="7"
        stroke="#7b61ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="404" y="494"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#c4b8ff" text-anchor="middle">🌙 Dark Mode</text>

  <!-- Pill: i18n -->
  <rect x="472" y="474" width="90" height="30" rx="7"
        fill="#7b61ff" fill-opacity="0.12"/>
  <rect x="472" y="474" width="90" height="30" rx="7"
        stroke="#7b61ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="517" y="494"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#c4b8ff" text-anchor="middle">🌐 PT / EN</text>

  <!-- Bottom author line -->
  <text x="80" y="575"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="12" fill="#4a4468">
    by Wagner Beethoven · wagnerbeethoven@gmail.com
  </text>


  <!-- ════════════════════════════════════════ -->
  <!-- RIGHT COLUMN — HTML hierarchy cards     -->
  <!-- ════════════════════════════════════════ -->

  <!-- Connecting tree lines (drawn first so cards go on top) -->
  <!-- header → nav -->
  <line x1="856" y1="196" x2="868" y2="230" stroke="#7b61ff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- nav → ul -->
  <line x1="916" y1="278" x2="928" y2="312" stroke="#7b61ff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- ul → li -->
  <line x1="976" y1="360" x2="988" y2="394" stroke="#7b61ff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- li → a -->
  <line x1="1038" y1="448" x2="1048" y2="476" stroke="#7b61ff" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Card 1: header (depth 0) -->
  <rect x="738" y="148" width="178" height="48" rx="9" fill="url(#cardGrad)"/>
  <rect x="738" y="148" width="178" height="48" rx="9" stroke="#2e2a4a" stroke-width="1"/>
  <!-- layer icon -->
  <rect x="758" y="166" width="12" height="12" rx="1" fill="none" stroke="#555" stroke-width="1.2"/>
  <line x1="756" y1="172" x2="758" y2="172" stroke="#555" stroke-width="1"/>
  <line x1="770" y1="172" x2="772" y2="172" stroke="#555" stroke-width="1"/>
  <line x1="764" y1="164" x2="764" y2="166" stroke="#555" stroke-width="1"/>
  <line x1="764" y1="178" x2="764" y2="180" stroke="#555" stroke-width="1"/>
  <text x="780" y="177" font-family="'Courier New', monospace" font-size="13" fill="#6b5fcc">&lt;</text>
  <text x="790" y="177" font-family="'Courier New', monospace" font-size="13" fill="#a891ff">header</text>
  <text x="854" y="177" font-family="'Courier New', monospace" font-size="13" fill="#6b5fcc">&gt;</text>
  <text x="868" y="177" font-family="'Courier New', monospace" font-size="11" fill="#3a3560">Frame</text>

  <!-- Card 2: nav (depth 1) -->
  <rect x="798" y="230" width="168" height="48" rx="9" fill="url(#cardGrad)"/>
  <rect x="798" y="230" width="168" height="48" rx="9" stroke="#2e2a4a" stroke-width="1"/>
  <text x="818" y="259" font-family="'Courier New', monospace" font-size="13" fill="#6b5fcc">&lt;</text>
  <text x="828" y="259" font-family="'Courier New', monospace" font-size="13" fill="#a891ff">nav</text>
  <text x="858" y="259" font-family="'Courier New', monospace" font-size="13" fill="#6b5fcc">&gt;</text>
  <text x="872" y="259" font-family="'Courier New', monospace" font-size="11" fill="#3a3560">Group</text>

  <!-- Card 3: ul (depth 2) -->
  <rect x="858" y="312" width="158" height="48" rx="9" fill="url(#cardGrad)"/>
  <rect x="858" y="312" width="158" height="48" rx="9" stroke="#2e2a4a" stroke-width="1"/>
  <text x="878" y="341" font-family="'Courier New', monospace" font-size="13" fill="#6b5fcc">&lt;</text>
  <text x="888" y="341" font-family="'Courier New', monospace" font-size="13" fill="#a891ff">ul</text>
  <text x="908" y="341" font-family="'Courier New', monospace" font-size="13" fill="#6b5fcc">&gt;</text>
  <text x="922" y="341" font-family="'Courier New', monospace" font-size="11" fill="#3a3560">Frame</text>

  <!-- Card 4: li — ACTIVE / highlighted -->
  <rect x="918" y="394" width="160" height="54" rx="9" fill="url(#activeCard)"/>
  <rect x="918" y="394" width="160" height="54" rx="9" stroke="#7b61ff" stroke-width="1.5"/>
  <!-- glow overlay -->
  <rect x="918" y="394" width="160" height="54" rx="9" fill="#7b61ff" fill-opacity="0.06"/>
  <text x="938" y="425" font-family="'Courier New', monospace" font-size="15" font-weight="600" fill="#8b7aee">&lt;</text>
  <text x="950" y="425" font-family="'Courier New', monospace" font-size="15" font-weight="600" fill="#d0c4ff">li</text>
  <text x="968" y="425" font-family="'Courier New', monospace" font-size="15" font-weight="600" fill="#8b7aee">&gt;</text>
  <text x="984" y="425" font-family="'Courier New', monospace" font-size="12" fill="#6050aa">Frame</text>
  <!-- active indicator dot -->
  <circle cx="1060" cy="421" r="4" fill="#7b61ff"/>

  <!-- Card 5: a (depth 4) -->
  <rect x="978" y="472" width="148" height="48" rx="9" fill="url(#cardGrad)"/>
  <rect x="978" y="472" width="148" height="48" rx="9" stroke="#2e2a4a" stroke-width="1"/>
  <text x="998" y="501" font-family="'Courier New', monospace" font-size="13" fill="#6b5fcc">&lt;</text>
  <text x="1008" y="501" font-family="'Courier New', monospace" font-size="13" fill="#a891ff">a</text>
  <text x="1020" y="501" font-family="'Courier New', monospace" font-size="13" fill="#6b5fcc">&gt;</text>
  <text x="1034" y="501" font-family="'Courier New', monospace" font-size="11" fill="#3a3560">Text</text>

  <!-- Full path label under cards -->
  <text x="738" y="570"
        font-family="'Courier New', Consolas, monospace"
        font-size="12" fill="#7b61ff" fill-opacity="0.5" letter-spacing="0.5">
    header &gt; nav &gt; ul &gt; li &gt; a
  </text>

  <!-- ─── Figma logo stamp bottom right ─── -->
  <text x="1220" y="575"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-size="11" fill="#3a3460" text-anchor="end">Figma Plugin</text>
</svg>
